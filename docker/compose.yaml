# HMS Sync production stack (single host).
#
#   cp .env.example .env    # fill in, then:
#   docker compose -f docker/compose.yaml up -d --build
#   docker compose -f docker/compose.yaml exec app php artisan migrate --force
#
# Put Nginx / Caddy / a load balancer with HTTPS in front of ports 8000
# (app) and 8080 (Reverb websocket) — see docs/DEPLOYMENT.md.

x-app: &app
  build:
    context: ..
    dockerfile: docker/octane/Dockerfile
  image: hms-sync:latest
  env_file: ../.env
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_CLIENT: phpredis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: reverb
    OCTANE_SERVER: roadrunner
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:8080:8080"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hms_sync}
      POSTGRES_USER: ${DB_USERNAME:-hms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hms}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  storage:
  redis:
  postgres:
